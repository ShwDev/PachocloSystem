spring.application.name=medicamentos

server.port=${PORT:8081}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

medicamentos.api-key=${MEDICAMENTOS_API_KEY:}

medicamentos.idempotencia.caducidad=24h

# MongoDB: URI de conexión (incluye la base de datos). En desarrollo, un
# MongoDB local sin autenticación; en producción, SPRING_MONGODB_URI apunta a
# la base real (p. ej. MongoDB Atlas).
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/medicamentos}

# Crea al arrancar los índices de las entidades (claves únicas de medicamentos
# e idempotencia). Sin esto, la base no impediría los duplicados.
spring.data.mongodb.auto-index-creation=true

# Health checks de Actuator: el readiness incluye la base de datos
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo

# Documentación OpenAPI/Swagger: /swagger-ui.html (interfaz) y /v3/api-docs (JSON).
# Con SWAGGER_ENABLED=false no se publica ninguna de las dos.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
