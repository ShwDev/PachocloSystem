spring.application.name=medicamentos

server.port=${PORT:8081}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

medicamentos.api-key=${MEDICAMENTOS_API_KEY:}

medicamentos.idempotencia.caducidad=24h

# MongoDB Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://pachoclo_user:password@clusterpachoclo.abcde.mongodb.net/medicamentos?retryWrites=true&w=majority}

# Health checks para Actuator (actualizado a mongo)
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo
