# Configuración de los tests: se suma a src/main/resources/application.properties y
# solo cambia la base de datos. Los tests usan una base PROPIA, que vacían antes de
# cada prueba: su nombre debe terminar en "_test" (BaseDeDatosDePruebas lo comprueba).
#
# El MongoDB lo arranca MongoDePruebasListener (Testcontainers) en el puerto fijo
# 27517 antes de crear el contexto. directConnection evita que el driver siga el
# host interno que anuncia el miembro del replica set.
spring.mongodb.uri=mongodb://localhost:27517/medicamentos_test?directConnection=true
spring.mongodb.auto-index-creation=true
