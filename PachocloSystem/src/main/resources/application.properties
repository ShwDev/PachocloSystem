spring.application.name=pachoclosystem

server.port=${PORT:8080}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=30
app.jwt.emisor=pachoclosystem

medicamentos.url=${MEDICAMENTOS_URL:http://localhost:8081}
medicamentos.timeout-conexion=2s
medicamentos.timeout-lectura=5s
medicamentos.api-key=${MEDICAMENTOS_API_KEY:}

historial.idempotencia.caducidad=24h

app.login.max-intentos=${APP_LOGIN_MAX_INTENTOS:5}
app.login.max-intentos-ip=${APP_LOGIN_MAX_INTENTOS_IP:50}
app.login.max-intentos-usuario=${APP_LOGIN_MAX_INTENTOS_USUARIO:100}
app.login.bloqueo-minutos=${APP_LOGIN_BLOQUEO_MINUTOS:15}
app.login.max-entradas=${APP_LOGIN_MAX_ENTRADAS:10000}
app.login.proxies-confiables=${APP_LOGIN_PROXIES_CONFIABLES:}

app.cors.origenes=${CORS_ORIGENES:}

# MongoDB: URI de conexión (incluye la base de datos). En desarrollo, un
# MongoDB local sin autenticación; en producción, SPRING_MONGODB_URI apunta a
# la base real (p. ej. MongoDB Atlas).
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/pachoclosystem}

# Crea al arrancar los índices de las entidades (claves únicas de usernames,
# ids de trabajador e idempotencia). Sin esto, la base no impediría duplicados.
spring.data.mongodb.auto-index-creation=true

# Health checks para Actuator (actualizado a mongo)
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo
