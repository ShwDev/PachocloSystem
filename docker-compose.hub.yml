# PachocloSystem desde Docker Hub: mismas piezas que docker-compose.yml, pero las 4 imágenes
# propias se DESCARGAN (image:) en vez de construirse (build:). No hace falta el código fuente.
# Para correrlo basta este archivo y un .env (copiar de .env.example):
#
#   cp .env.example .env
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d      # Angular: http://localhost:4200
#                                                        # React:   http://localhost:4300
#
# Imágenes: https://hub.docker.com/u/twcfine  (pachoclo-frontend, pachoclo-frontend-react,
# pachoclo-api, pachoclo-medicamentos). Se construyen y publican con scripts/publicar-imagenes.sh.
# Para abrir los Swagger en el host, añada -f docker-compose.demo.yml (ver ese archivo).
name: pachoclosystem

services:
  # ---------- Frontend: SPA Angular servida por nginx ----------
  frontend:
    image: ${DOCKERHUB_USER:-twcfine}/pachoclo-frontend:${IMAGE_TAG:-1.0}
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    networks:
      publica:
        # IP fija: es el único proxy de confianza de pachoclo-api (APP_LOGIN_PROXIES_CONFIABLES).
        ipv4_address: ${NGINX_IP:-172.28.10.10}
    depends_on:
      pachoclo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- Frontend React: app independiente de Medicamentos (nginx) ----------
  frontend-react:
    image: ${DOCKERHUB_USER:-twcfine}/pachoclo-frontend-react:${IMAGE_TAG:-1.0}
    ports:
      - "${FRONTEND_REACT_PORT:-4300}:8080"
    networks:
      publica:
        # IP fija: segundo proxy de confianza de pachoclo-api.
        ipv4_address: ${NGINX_REACT_IP:-172.28.10.11}
    depends_on:
      pachoclo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- API principal: JWT, roles, pacientes, trabajadores, historial ----------
  pachoclo-api:
    image: ${DOCKERHUB_USER:-twcfine}/pachoclo-api:${IMAGE_TAG:-1.0}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD en .env}
      # Enlace con el microservicio y con su base: se resuelven por nombre de servicio.
      MEDICAMENTOS_URL: http://medicamentos-service:8081
      MEDICAMENTOS_API_KEY: ${MEDICAMENTOS_API_KEY:?defina MEDICAMENTOS_API_KEY en .env}
      SPRING_MONGODB_URI: ${PACHOCLO_MONGO_URI:?defina PACHOCLO_MONGO_URI en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-}
      # Solo las IP de los dos nginx (Angular y React): de ellas se acepta X-Forwarded-For. No debe
      # ser todo el rango de la red, porque incluiría la puerta de enlace (la IP con la que nginx ve
      # al cliente).
      APP_LOGIN_PROXIES_CONFIABLES: ${NGINX_IP:-172.28.10.10},${NGINX_REACT_IP:-172.28.10.11}
      # Logs a archivo, además de la consola, en el volumen pachoclo-logs.
      LOGGING_FILE_NAME: /var/log/pachoclo/pachoclosystem.log
    volumes:
      - pachoclo-logs:/var/log/pachoclo
    networks:
      publica:
      interna:
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      medicamentos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------- Microservicio de inventario: solo accesible desde la red interna ----------
  medicamentos-service:
    image: ${DOCKERHUB_USER:-twcfine}/pachoclo-medicamentos:${IMAGE_TAG:-1.0}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      MEDICAMENTOS_API_KEY: ${MEDICAMENTOS_API_KEY:?defina MEDICAMENTOS_API_KEY en .env}
      SPRING_MONGODB_URI: ${MEDICAMENTOS_MONGO_URI:?defina MEDICAMENTOS_MONGO_URI en .env}
    networks:
      interna:
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------- MongoDB compartido: las dos bases en la misma instancia ----------
  # Réplica de un solo nodo (rs0): las transacciones de MongoDB las necesitan.
  # Sin puerto al host y sin autenticación: solo es alcanzable desde la red interna.
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-datos:/data/db
    networks:
      interna:
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------- Inicialización del replica set ----------
  # Idempotente: si rs0 ya existe no hace nada; si no, lo crea y espera a que el
  # nodo sea primario. Los backends no arrancan hasta que termina (y sale con 0).
  mongo-init:
    image: mongo:8
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status() } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})
          }'
        for intento in $$(seq 1 30); do
          if mongosh --host mongo:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
            exit 0
          fi
          sleep 1
        done
        echo "El nodo de MongoDB no llegó a primario" >&2
        exit 1
    networks:
      interna:
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

networks:
  # Frontend y API. Subred fija para poder declararla como proxy confiable del login.
  publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # Bases de datos y medicamentos-service. "internal" = sin salida a internet ni al host.
  interna:
    driver: bridge
    internal: true

volumes:
  mongo-datos:
  pachoclo-logs:
