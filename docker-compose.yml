name: pachoclosystem

services:
  # ---------- Frontend: SPA Angular servida por nginx ----------
  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    networks:
      publica:
        ipv4_address: ${NGINX_IP:-172.28.10.10}
    depends_on:
      pachoclo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- API principal: JWT, roles, pacientes, trabajadores, historial ----------
  pachoclo-api:
    build: ./PachocloSystem
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-api:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD en .env}
      MEDICAMENTOS_URL: http://medicamentos-service:8081
      MEDICAMENTOS_API_KEY: ${MEDICAMENTOS_API_KEY:?defina MEDICAMENTOS_API_KEY en .env}
      SPRING_DATA_MONGODB_URI: ${PACHOCLO_MONGO_URI:?defina PACHOCLO_MONGO_URI en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-}
      APP_LOGIN_PROXIES_CONFIABLES: ${NGINX_IP:-172.28.10.10}
      LOGGING_FILE_NAME: /var/log/pachoclo/pachoclosystem.log
    volumes:
      - pachoclo-logs:/var/log/pachoclo
    networks:
      publica:
      interna:
    depends_on:
      medicamentos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------- Microservicio de inventario ----------
  medicamentos-service:
    build: ./MedicamentosService
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-medicamentos:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      MEDICAMENTOS_API_KEY: ${MEDICAMENTOS_API_KEY:?defina MEDICAMENTOS_API_KEY en .env}
      SPRING_DATA_MONGODB_URI: ${MEDICAMENTOS_MONGO_URI:?defina MEDICAMENTOS_MONGO_URI en .env}
    networks:
      interna:
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  interna:
    driver: bridge

volumes:
  pachoclo-logs:
