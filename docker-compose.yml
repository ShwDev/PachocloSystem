name: pachoclosystem

services:
  # ---------- Frontend: SPA Angular servida por nginx ----------
  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    networks:
      publica:
        ipv4_address: ${NGINX_IP:-172.28.10.10}
    depends_on:
      pachoclo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- Frontend React: app independiente de Medicamentos (nginx) ----------
  frontend-react:
    build: ./frontend-react
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-frontend-react:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_REACT_PORT:-4300}:8080"
    networks:
      publica:
        ipv4_address: ${NGINX_REACT_IP:-172.28.10.11}
    depends_on:
      pachoclo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- API principal: JWT, roles, pacientes, trabajadores, historial ----------
  pachoclo-api:
    build: ./PachocloSystem
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-api:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD en .env}
      MEDICAMENTOS_URL: http://medicamentos-service:8081
      MEDICAMENTOS_API_KEY: ${MEDICAMENTOS_API_KEY:?defina MEDICAMENTOS_API_KEY en .env}
      SPRING_MONGODB_URI: ${PACHOCLO_MONGO_URI:?defina PACHOCLO_MONGO_URI en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-}
      # Los dos nginx (Angular y React) son proxies de confianza para X-Forwarded-For.
      APP_LOGIN_PROXIES_CONFIABLES: ${NGINX_IP:-172.28.10.10},${NGINX_REACT_IP:-172.28.10.11}
      LOGGING_FILE_NAME: /var/log/pachoclo/pachoclosystem.log
    volumes:
      - pachoclo-logs:/var/log/pachoclo
    networks:
      publica:
      interna:
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      medicamentos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------- Microservicio de inventario ----------
  medicamentos-service:
    build: ./MedicamentosService
    image: ${DOCKERHUB_USER:-pachoclo}/pachoclo-medicamentos:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      MEDICAMENTOS_API_KEY: ${MEDICAMENTOS_API_KEY:?defina MEDICAMENTOS_API_KEY en .env}
      SPRING_MONGODB_URI: ${MEDICAMENTOS_MONGO_URI:?defina MEDICAMENTOS_MONGO_URI en .env}
    networks:
      interna:
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------- MongoDB compartido: las dos bases en la misma instancia ----------
  # Réplica de un solo nodo (rs0): las transacciones y el cerrojo administrativo
  # de MongoDB las necesitan. Sin puerto al host y sin autenticación: solo es
  # alcanzable desde la red interna.
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-datos:/data/db
    networks:
      interna:
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------- Inicialización del replica set ----------
  # Idempotente: si rs0 ya existe no hace nada; si no, lo crea y espera a que el
  # nodo sea primario. Los backends no arrancan hasta que termina (y sale con 0).
  mongo-init:
    image: mongo:8
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status() } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})
          }'
        for intento in $$(seq 1 30); do
          if mongosh --host mongo:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
            exit 0
          fi
          sleep 1
        done
        echo "El nodo de MongoDB no llegó a primario" >&2
        exit 1
    networks:
      interna:
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

networks:
  publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # MongoDB y medicamentos-service. "internal" = sin salida a internet ni al host.
  interna:
    driver: bridge
    internal: true

volumes:
  mongo-datos:
  pachoclo-logs:
