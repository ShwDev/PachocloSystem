# Integración continua: pruebas de los dos servicios (contra MongoDB real) y del
# frontend (tests, lint, formato y build) en cada push, a cualquier rama, y en cada PR.
#
# Los tests arrancan su propio MongoDB con Testcontainers (réplica de un nodo, en
# un puerto fijo), así que el runner solo necesita Docker, que ya trae
# ubuntu-latest. No hay credenciales ni servicios que configurar.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pachoclosystem:
    name: PachocloSystem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PachocloSystem
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests
        run: ./mvnw -B -ntp verify
      - name: Informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pachoclosystem-surefire
          path: PachocloSystem/target/surefire-reports
          retention-days: 7

  medicamentos:
    name: MedicamentosService
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MedicamentosService
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests
        run: ./mvnw -B -ntp verify
      - name: Informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: medicamentos-surefire
          path: MedicamentosService/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --watch=false
      - name: Tests de React
        run: npm run test:react
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Build de Vercel (URL de ejemplo)
        run: npm run build:vercel
        env:
          API_BASE_URL: https://pachoclosystem.example.com
